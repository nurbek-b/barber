name: CI

# PRs run it directly; pushes to main run it through deploy-cloudrun.yml (workflow_call).
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - '.github/workflows/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barber
          POSTGRES_PASSWORD: barber
          POSTGRES_DB: barber_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U barber" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://barber:barber@localhost:5432/barber_test
      DATABASE_URL: postgresql+asyncpg://barber:barber@localhost:5432/barber_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check . && ruff format --check .
      - name: mypy
        run: mypy app tests
      - name: pytest
        run: pytest -q
      - name: migrations match models
        run: alembic upgrade head && alembic check

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - name: api-client matches the backend OpenAPI schema
        run: |
          pip install ./backend
          BACKEND_PYTHON=python pnpm check:api
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: build (incl. Mini App first-screen budget)
        run: pnpm build

  e2e:
    needs: [changes, frontend]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barber/miniapp exec playwright install --with-deps chromium
      - run: pnpm --filter @barber/miniapp e2e
      - run: pnpm --filter @barber/admin e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/*/playwright-report
          retention-days: 7

  docker:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose files are valid
        run: |
          cp infra/.env.example infra/.env && touch infra/backend.env
          docker compose -f infra/compose.prod.yml --env-file infra/.env config --quiet
          docker compose -f infra/compose.dev.yml --profile full config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: backend image builds
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: nginx image builds and config is valid
        run: |
          docker build -f infra/nginx/Dockerfile -t barber-nginx:ci .
          docker run --rm -e DOMAIN=localhost -e API_UPSTREAM=127.0.0.1:8000 \
            -e BOT_UPSTREAM=127.0.0.1:8001 --entrypoint sh barber-nginx:ci -c '
              mkdir -p /etc/letsencrypt/live/localhost &&
              apk add --no-cache openssl >/dev/null &&
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=localhost \
                -keyout /etc/letsencrypt/live/localhost/privkey.pem \
                -out /etc/letsencrypt/live/localhost/fullchain.pem 2>/dev/null &&
              /docker-entrypoint.d/20-envsubst-on-templates.sh && nginx -t'
