name: Deploy (Cloud Run + Firebase)

# main → CI → build image → migrate → Cloud Run services → Firebase Hosting → bot webhook.
# Auth: Workload Identity Federation — GitHub's OIDC token is exchanged for a one-hour token of
# barber-deploy@. No long-lived key is stored anywhere; only refs/heads/main of nurbek-b/barber
# is accepted by the provider (see the "GitHub auto-deploy" section of README).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

permissions:
  contents: read

env:
  WIF_PROVIDER: projects/259722493262/locations/global/workloadIdentityPools/github/providers/barber-repo
  DEPLOY_SA: barber-deploy@britva-barber.iam.gserviceaccount.com

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g firebase-tools@15
      - name: Deploy
        env:
          BUILDER: docker
          TAG: ${{ github.sha }}
        run: infra/cloudrun/deploy.sh
      - name: Smoke check
        run: |
          curl -fsS https://britva-barber.web.app/api/v1/health/ready
          curl -fsS -o /dev/null https://britva-barber.web.app/admin/
          curl -fsS -o /dev/null https://britva-barber.web.app/app/
