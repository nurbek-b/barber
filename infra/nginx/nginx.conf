worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 6m; # barber photos are limited to 5 MB by the API

  log_format json escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
                              '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                              '"rt":$request_time,"upstream_rt":"$upstream_response_time",'
                              '"request_id":"$request_id","ua":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Outer rate limits (the API has its own per-client limits in Redis)
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  include /etc/nginx/conf.d/*.conf;
}
